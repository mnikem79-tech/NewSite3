<nav class="breadcrumbs" aria-label="Хлебные крошки">
    <a href="{% url 'catalog:home' %}">Главная</a>
    {% for crumb in breadcrumbs %}
        <span>/</span><a href="{{ crumb.get_absolute_url }}">{{ crumb.name }}</a>
    {% endfor %}
    {% if current %}<span>/</span>{{ current }}{% endif %}
</nav>
